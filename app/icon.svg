<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- White Glow Filter -->
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Radial Gradients for premium depth -->
    <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Blue Rounded Tile Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Radar Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" filter="url(#white-glow)" />
  
  <!-- Inner Radar Circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" filter="url(#white-glow)" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

  <!-- Perfect 45/90 Degree Crosshairs -->
  <!-- 90 Degree (Vertical) -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 10" />
  <!-- 0 Degree (Horizontal) -->
  <line x1="20" y1="256" x2="492" y2="256" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 10" />
  
  <!-- 45 Degree Diagonal -->
  <line x1="89" y1="89" x2="423" y2="423" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />
  <!-- 135 Degree Diagonal -->
  <line x1="89" y1="423" x2="423" y2="89" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Outer Radar Tick Marks -->
  <!-- 30 deg ticks -->
  <line x1="446.5" y1="366" x2="437.9" y2="361" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  <line x1="65.5" y1="146" x2="74.1" y2="151" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- 60 deg ticks -->
  <line x1="366" y1="446.5" x2="361" y2="437.9" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  <line x1="146" y1="65.5" x2="151" y2="74.1" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />

  <!-- 120 deg ticks -->
  <line x1="146" y1="446.5" x2="151" y2="437.9" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  <line x1="366" y1="65.5" x2="361" y2="74.1" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />

  <!-- 150 deg ticks -->
  <line x1="65.5" y1="366" x2="74.1" y2="361" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  <line x1="446.5" y1="146" x2="437.9" y2="151" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />

  <!-- Sleek Cybernetic Eye Graphic (Central Focus) -->
  <!-- Upper Eyelid -->
  <path d="M 116 256 C 176 146, 336 146, 396 256" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#white-glow)" />
  <!-- Lower Eyelid -->
  <path d="M 116 256 C 176 366, 336 366, 396 256" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#white-glow)" />

  <!-- Eye Corner Nodes -->
  <circle cx="116" cy="256" r="5" fill="#ffffff" filter="url(#white-glow)" />
  <circle cx="396" cy="256" r="5" fill="#ffffff" filter="url(#white-glow)" />

  <!-- Glowing Iris Outer Ring -->
  <circle cx="256" cy="256" r="64" fill="url(#iris-grad)" stroke="#ffffff" stroke-width="3" filter="url(#white-glow)" />
  
  <!-- Cybernetic Iris Segment Lines -->
  <line x1="256" y1="192" x2="256" y2="204" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />
  <line x1="256" y1="320" x2="256" y2="308" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />
  <line x1="192" y1="256" x2="204" y2="256" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />
  <line x1="320" y1="256" x2="308" y2="256" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Glowing Core Pupil -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" filter="url(#white-glow)" />
  <circle cx="256" cy="256" r="12" fill="#1e3a8a" />
  <circle cx="262" cy="250" r="4" fill="#ffffff" /> <!-- Pupil Glare/Reflection -->

  <!-- High-Tech Target Box Accents -->
  <path d="M 40 40 L 80 40 M 40 40 L 40 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square" />
  <path d="M 472 40 L 432 40 M 472 40 L 472 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square" />
  <path d="M 40 472 L 80 472 M 40 472 L 40 432" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square" />
  <path d="M 472 472 L 432 472 M 472 472 L 472 432" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square" />

</svg>
